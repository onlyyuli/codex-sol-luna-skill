name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate repository contracts
        run: |
          python tools/sync_repository_metadata.py --repository "$GITHUB_REPOSITORY" --check
          python tools/validate_repository.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run benchmark fixture tests
        working-directory: benchmarks/fixture
        run: python -m unittest discover -s tests
      - name: Check benchmark dry run
        run: |
          python benchmarks/run_matrix.py
          python benchmarks/run_routing_contract.py
          python benchmarks/run_compatibility_smoke.py
      - name: Parse PowerShell installer
        shell: pwsh
        run: '[ScriptBlock]::Create((Get-Content -Raw installer/install.ps1)) | Out-Null'
      - name: Install PSScriptAnalyzer
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell installer
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer installer/install.ps1 -Severity Error,Warning
          $findings | Format-Table
          if ($findings) { throw "PSScriptAnalyzer reported findings." }
      - name: Parse POSIX installer
        if: runner.os != 'Windows'
        run: sh -n installer/install.sh
      - name: Install ShellCheck
        if: runner.os == 'Linux' && matrix.python == '3.11'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Analyze POSIX installer
        if: runner.os == 'Linux' && matrix.python == '3.11'
        run: shellcheck installer/install.sh

  codex-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install current Codex CLI
        run: npm install --global @openai/codex@latest
      - name: Require a stable Codex CLI
        run: python tools/check_codex_release.py
      - name: Exercise real plugin CLI in an isolated home
        run: python tests/integration_local_install.py
      - name: Exercise POSIX wrapper
        if: runner.os != 'Windows'
        run: python tests/integration_local_install.py --entrypoint shell
      - name: Exercise PowerShell wrapper
        if: runner.os == 'Windows'
        run: python tests/integration_local_install.py --entrypoint powershell
