name: Bug report
description: Report a reproducible workflow, installer, or compatibility defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, auth files, private prompts, private repository content, or unredacted logs."
  - type: input
    id: codex-version
    attributes:
      label: Codex version
      placeholder: "codex-cli ..."
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the invocation, expected behavior, and redacted actual result.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor output
      description: Run the non-billable doctor and remove private paths or values.
