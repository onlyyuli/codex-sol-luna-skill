name: Feature request
description: Propose a bounded workflow or portability improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed behavior
      description: Explain routing, permissions, compatibility, and validation impact.
    validations:
      required: true
